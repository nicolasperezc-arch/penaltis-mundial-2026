radial-gradient(
circle,

transparent 2px

radial-gradient(
circle,

transparent 2px

12px 12px,
16px 16px,
19px 19px,
auto;

height:105px;

transform:

translateX(-50%)

bottom,

top:50%;

to bottom,

pointer-events:none;
}

opacity:.85;

ballTrail .28s linear infinite;

@keyframes ballTrail{

0%{
opacity:.15;
transform:
translate(-50%,-50%)
scale(.6)
rotate(0deg);
}

50%{
opacity:.85;
transform:
translate(-50%,-50%)

<script>

/* =====================================================
   PARTIDOS
===================================================== */

const matches=[

{
name:"MÉXICO",
short:"MEX",
flag:"🇲🇽",
mascot:"🐆",
mascotName:"Zayu"
},

{
name:"CANADÁ",
short:"CAN",
flag:"🇨🇦",
mascot:"🫎",
mascotName:"Maple"
},

name:"ESTADOS UNIDOS",
short:"USA",
flag:"🇺🇸",
mascot:"🦅",
mascotName:"Clutch"
}

];


/* =====================================================
   VARIABLES
===================================================== */

let matchIndex=0;
let round=0;
let playerGoals=0;
let opponentGoals=0;
let totalGoals=0;
let totalSaves=0;
let busy=false;
let results=[];


/* =====================================================

===================================================== */

const keeperEmoji=document.getElementById("keeperEmoji");
const keeperLabel=document.getElementById("keeperLabel");

const defendPanel=document.getElementById("defendPanel");
const gameArea=document.getElementById("game");


/* =====================================================
   SISTEMA DE AUDIO
===================================================== */

let audioCtx=null;

function initAudio(){

try{

const AudioContext=
window.AudioContext ||
window.webkitAudioContext;

if(!AudioContext)
return null;

if(!audioCtx){

audioCtx=new AudioContext();

}

if(audioCtx.state==="suspended"){

audioCtx.resume();

}

return audioCtx;

}catch(error){

return null;

}

}


/* Sonido básico */

function playTone(
frequency,
duration,
volume,
type="sine",
startDelay=0
){

const ctx=initAudio();

if(!ctx)
return;

const oscillator=
ctx.createOscillator();

const gain=
ctx.createGain();

const start=
ctx.currentTime+
startDelay;

const end=
start+
duration;

oscillator.type=type;

oscillator.frequency.setValueAtTime(
frequency,
start
);

gain.gain.setValueAtTime(
0.0001,
start
);

gain.gain.exponentialRampToValueAtTime(
volume,
start+0.015
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
end
);

oscillator.connect(gain);

gain.connect(ctx.destination);

oscillator.start(start);

oscillator.stop(end+0.03);

}


/* Disparo */

function soundShot(){

playTone(
180,
0.10,
0.10,
"triangle"
);

playTone(
280,
0.12,
0.07,

);

}

return "28%";

if(lane===1)
return "50%";

return "72%";

}

   ACTUALIZAR PARTIDO
===================================================== */

/* =====================================================

===================================================== */

ball.classList.remove("shooting");

ball.style.left="50%";

ball.style.bottom="22%";

ball.style.transform=
"translateX(-50%) rotate(0deg) scale(1)";

keeper.style.left="50%";

keeper.className="";

}


/* =====================================================
   TURNO
===================================================== */

function updateTurn(){

if(round>=8){

finishMatch();

return;

}

if(round%2===0){

shootPanel.classList.add("hidden");

defendPanel.classList.add("hidden");

const m=matches[matchIndex];

keeperEmoji.textContent=m.mascot;

keeperLabel.textContent=m.mascotName;

message.textContent=
"⚽ TOCA LA CANCHA PARA TIRAR";

}

else{

shootPanel.classList.add("hidden");

defendPanel.classList.add("hidden");

/* PORTERO DE COLOMBIA */

keeperEmoji.textContent="🧑🏻";

keeperLabel.textContent="PORTERO";

message.textContent=
"🧤 TOCA LA CANCHA PARA ATAJAR";

}

}


/* =====================================================
   MOVER ARQUERO
===================================================== */

function moveKeeper(direction){

keeper.style.left=
lanePercent(direction);

keeper.className="";

if(direction===0){

keeper.classList.add("left");

}

else if(direction===1){

keeper.classList.add("center");

}

else{

keeper.classList.add("right");

}

}


/* =====================================================
   CREAR JUGADA
===================================================== */

function makePlay(
playerDirection,
playerIsShooting
){

const isGoal=
Math.random()<0.5;

let shotDirection;
let keeperDirection;

if(playerIsShooting){

shotDirection=playerDirection;

if(isGoal){

const otherDirections=
[0,1,2].filter(
d=>d!==shotDirection
);

keeperDirection=
otherDirections[
Math.floor(
Math.random()*
otherDirections.length
)
];

}

else{

keeperDirection=shotDirection;

}

}

else{

keeperDirection=playerDirection;

if(isGoal){

const otherDirections=
[0,1,2].filter(
d=>d!==keeperDirection
);

shotDirection=
otherDirections[
Math.floor(
Math.random()*
otherDirections.length
)
];

}

else{

shotDirection=keeperDirection;

}

}

return{

goal:isGoal,

shot:shotDirection,

keeper:keeperDirection

};

}


/* =====================================================
   ANIMACIÓN BALÓN
===================================================== */

function animateBall(
direction,
callback
){

const targets=[
28,
50,
72
];

const startX=50;

const startBottom=22;

const endX=
targets[direction];

const endBottom=61;

const startTime=
performance.now();

const duration=720;

ball.classList.add("shooting");

function animation(time){

let progress=
(time-startTime)/
duration;

if(progress>1)
progress=1;

const ease=
progress<0.5
?
2*progress*progress
:
1-
Math.pow(
-2*progress+2,
2
)/2;

const currentX=
startX+
(endX-startX)*
ease;

const currentBottom=
startBottom+
(endBottom-startBottom)*
ease;

const rotation=
1080*ease;

const scale=
1-(ease*.43);

ball.style.left=
currentX+"%";

ball.style.bottom=
currentBottom+"%";

ball.style.transform=
"translateX(-50%) "+
"rotate("+rotation+"deg) "+
"scale("+scale+")";

if(progress<1){

requestAnimationFrame(
animation
);

}

else{

setTimeout(
callback,
80
);

}

}

requestAnimationFrame(
animation
);

}


/* =====================================================
   COLOMBIA PATEA
===================================================== */

function shoot(direction){

if(busy)
return;

if(round%2!==0)
return;

if(round>=8)
return;

busy=true;

/* ACTIVAR AUDIO DIRECTAMENTE AL TOCAR */

initAudio();

soundShot();

round++;

updateScore();

message.textContent=
"⚽ ¡DISPARO!";

const play=
makePlay(
direction,
true
);

moveKeeper(
play.keeper
);

animateBall(
play.shot,
function(){

if(play.goal){

playerGoals++;

totalGoals++;

soundGoal();

message.textContent=
"🔥 ¡GOOOOOOL!";

markPlayer(
Math.ceil(round/2),
"goal"
);

}

else{

totalSaves++;

soundSave();

message.textContent=
"🧤 ¡ATAJÓ "+
matches[matchIndex].mascotName+
"!";

markPlayer(
Math.ceil(round/2),
"miss"
);

}

updateScore();

setTimeout(
function(){

resetPositions();

busy=false;

updateTurn();

},
900
);

});

}


/* =====================================================
   COLOMBIA ATAJA
===================================================== */

function defend(direction){

if(busy)
return;

if(round%2===0)
return;

if(round>=8)
return;

busy=true;

/* ACTIVAR AUDIO DIRECTAMENTE AL TOCAR */

initAudio();

soundShot();

round++;

updateScore();

const m=
matches[matchIndex];

message.textContent=
"⚽ ¡"+
m.mascotName+
" PATEA!";

const play=
makePlay(
direction,
false
);

moveKeeper(
play.keeper
);

animateBall(
play.shot,
function(){

if(play.goal){

opponentGoals++;

totalGoals++;

soundGoal();

message.textContent=
"⚽ ¡GOL DE "+
m.mascotName+
"!";

markOpponent(
Math.ceil(round/2),
"goal"
);

}

else{

totalSaves++;

soundSave();

message.textContent=
"🧤 ¡ATAJASTE EL PENAL!";

markOpponent(
Math.ceil(round/2),
"miss"
);

}

updateScore();

setTimeout(
function(){

resetPositions();

busy=false;

updateTurn();

},
900
);

});

}


/* =====================================================
   MARCADOR COLOMBIA
===================================================== */

function markPlayer(
number,
result
){

const dot=
document.getElementById(
"p"+number
);

if(!dot)
return;

dot.classList.remove(
"goal",
"miss"
);

dot.classList.add(
result
);

}


/* =====================================================
   MARCADOR RIVAL
===================================================== */

function markOpponent(
number,
result
){

const dot=
document.getElementById(
"o"+number
);

if(!dot)
return;

dot.classList.remove(
"goal",
"miss"
);

dot.classList.add(
result
);

}


/* =====================================================
   FINAL PARTIDO
===================================================== */

function finishMatch(){

busy=true;

const m=
matches[matchIndex];

let text;

if(
playerGoals>
opponentGoals
){

text=
"🏆 GANASTE CONTRA "+
m.name+
" · "+
playerGoals+
" - "+
opponentGoals;

}

else if(
playerGoals<
opponentGoals
){

text=
"😬 PERDISTE CONTRA "+
m.name+
" · "+
playerGoals+
" - "+
opponentGoals;

}

else{

if(Math.random()<0.5){

text=
"🏆 GANASTE CONTRA "+
m.name+
" EN DESEMPATE · "+
playerGoals+
" - "+
opponentGoals;

}

else{

text=
"😬 PERDISTE CONTRA "+
m.name+
" EN DESEMPATE · "+
playerGoals+
" - "+
opponentGoals;

}

}

results.push(text);

message.textContent=text;

setTimeout(
function(){

matchIndex++;

if(
matchIndex>=
matches.length
){

finishTournament();

return;

}

round=0;

playerGoals=0;

opponentGoals=0;

resetDots();

resetPositions();

updateMatch();

updateScore();

busy=false;

updateTurn();

},
1800
);

}


/* =====================================================
   FINAL TORNEO
===================================================== */

function finishTournament(){

const screen=
document.getElementById(
"finalScreen"
);

screen.style.display="flex";

let wins=0;

let losses=0;

results.forEach(
function(result){

if(result.includes("GANASTE"))
wins++;

if(result.includes("PERDISTE"))
losses++;

}
);

const icon=
document.getElementById(
"finalIcon"
);

const title=
document.getElementById(
"finalTitle"
);

const text=
document.getElementById(
"finalText"
);

if(wins>losses){

icon.textContent="🏆";

title.textContent=
"🏆 ¡CAMPEÓN!";

text.textContent=
"¡Colombia ganó el torneo!";

soundWin();

}

else{

icon.textContent="😢";

title.textContent=
"😢 TORNEO TERMINADO";

text.textContent=
"Colombia no pudo ganar el torneo.";

soundLose();

}

document.getElementById(
"finalGames"
).innerHTML=
results.join(
"<br><br>"
);

}


/* =====================================================
   LIMPIAR PUNTOS
===================================================== */

function resetDots(){

document
.querySelectorAll(".dot")
.forEach(
function(dot){

dot.classList.remove(
"goal",
"miss"
);

}
);

}


/* =====================================================
   REINICIAR
===================================================== */

function resetGame(){

/* También desbloquea el audio al pulsar NUEVO */

initAudio();

matchIndex=0;

round=0;

playerGoals=0;

opponentGoals=0;

totalGoals=0;

totalSaves=0;

busy=false;

results=[];

document.getElementById(
"finalScreen"
).style.display="none";

resetDots();

resetPositions();

updateMatch();

updateScore();

updateTurn();

}


/* =====================================================
   TOCAR LA CANCHA
===================================================== */

/*
   MUY IMPORTANTE:
   El AudioContext se inicializa aquí,
   directamente dentro del evento táctil.
   Esto permite que funcione mejor en iPhone/Safari.
*/

gameArea.addEventListener(
"pointerdown",
function(e){

if(
e.target.closest("#newGame") ||
e.target.closest("#finalScreen") ||
e.target.closest("#matchInfo")
){

return;

}

/* ACTIVAR AUDIO CON EL TOQUE */

initAudio();

if(busy || round>=8){

return;

}

const rect=
gameArea.getBoundingClientRect();

const x=
e.clientX-
rect.left;

const porcentaje=
x/rect.width;

let direction;

if(porcentaje<0.333){

direction=0;

}

else if(porcentaje<0.666){

direction=1;

}

else{

direction=2;

}

if(round%2===0){

shoot(direction);

}

else{

defend(direction);

}

},
{
passive:true
}
);


/* =====================================================
   INICIO
===================================================== */

updateMatch();

resetPositions();

updateScore();

updateTurn();

</script>
